<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f6b47">
<title>Gyvenimas Vilniuje</title>
<style>
:root{--bg:#f4f1e8;--paper:#fffdf7;--ink:#1e1f1c;--muted:#6b6a62;--line:#e2dccd;--line2:#efeadf;--accent:#0f6b47;--accent-soft:#e3f0e8;--yel:#f2b705;--red:#b8322b;--ok:#1d8a4e;--ok-soft:#e2f4e8;--bad:#c0392b;--bad-soft:#fbe7e4;--warn:#b7791f;--warn-soft:#fdf2dc;--shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
--on-accent:#fff;--cN:#6b7280;--cG:#7c3aed;--cD:#d97706;--cA:#dc2626;--cI:#2563eb;--cL:#059669;--cV:#db2777;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121412;--paper:#1b1e1b;--ink:#ecebe6;--muted:#a4a39b;--line:#2f332f;--line2:#252925;--accent:#3fb37f;--accent-soft:#1a2e24;--on-accent:#06140c;--ok:#4cc07f;--ok-soft:#173022;--bad:#ef6b5e;--bad-soft:#3a1e1b;--warn:#e0a84a;--warn-soft:#352a16;--shadow:0 1px 2px rgba(0,0,0,.4);--cN:#9ca3af;--cG:#a78bfa;--cD:#fbbf24;--cA:#f87171;--cI:#60a5fa;--cL:#34d399;--cV:#f472b6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121412;--paper:#1b1e1b;--ink:#ecebe6;--muted:#a4a39b;--line:#2f332f;--line2:#252925;--accent:#3fb37f;--accent-soft:#1a2e24;--on-accent:#06140c;--ok:#4cc07f;--ok-soft:#173022;--bad:#ef6b5e;--bad-soft:#3a1e1b;--warn:#e0a84a;--warn-soft:#352a16;--shadow:0 1px 2px rgba(0,0,0,.4);--cN:#9ca3af;--cG:#a78bfa;--cD:#fbbf24;--cA:#f87171;--cI:#60a5fa;--cL:#34d399;--cV:#f472b6;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{overflow-x:clip;margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 8px;line-height:1.2}
h2{font-size:20px}h3{font-size:16px}
p{margin:0 0 8px}
.wrap{max-width:1100px;margin:0 auto;padding-left:16px;padding-right:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.flag{height:4px;background:linear-gradient(to bottom,var(--yel) 0 33%,#0f6b47 33% 66%,var(--red) 66%)}
.toprow{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.brand{font-weight:800;font-size:17px;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.02em}
.topinfo{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:14px}
.pill{background:var(--line2);border-radius:99px;padding:3px 10px;font-weight:700;white-space:nowrap}
.pill.money{color:var(--ok)}.pill.money.neg{color:var(--bad)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--paper);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-size:11.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:19px;line-height:1}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:700}
main{padding:12px 0 20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px;touch-action:manipulation}
.btn:hover:not([disabled]){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13.5px;font-weight:600}
.btn.ghost{background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.meter{font-size:12.5px}
.meter .lab{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.bar i.mid{background:var(--yel)}.bar i.low{background:var(--bad)}
.slots{display:flex;gap:4px;align-items:center;font-size:12.5px;font-weight:600}
.slots b{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block}
.slots b.used{background:var(--line)}
.status{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12.5px;margin-top:10px}
.status div{background:var(--line2);border-radius:8px;padding:5px 8px}
.status span{display:block;color:var(--muted);font-size:11px}
/* map */
.map{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.loc{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:86px;box-shadow:var(--shadow)}
.loc:hover:not([disabled]){border-color:var(--accent)}
.loc .ic{font-size:22px;line-height:1}
.loc b{font-size:14.5px}
.loc .ru{font-size:12px;color:var(--muted)}
.loc[disabled]{opacity:.5;cursor:not-allowed}
.acts{display:flex;flex-direction:column;gap:8px}
.act{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--paper);cursor:pointer;text-align:left;width:100%}
.act:hover:not([disabled]){border-color:var(--accent)}
.act[disabled]{opacity:.5;cursor:not-allowed}
.act .t{font-weight:700}.act .d{font-size:12.5px;color:var(--muted)}
.act .price{font-weight:800;white-space:nowrap}
.log{font-size:13px;max-height:180px;overflow:auto}
.log div{padding:3px 0;border-bottom:1px dashed var(--line)}
/* task */
.task .npc{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.task .npc .av{font-size:26px;line-height:1}
.task .npc .bub{background:var(--line2);border-radius:12px;padding:8px 12px;font-size:15px}
.task .npc .who{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.task .sit{font-size:14px;color:var(--muted);margin-bottom:8px}
.sent{font-size:21px;line-height:1.5;font-weight:600;margin:6px 0 4px}
.blank{display:inline-block;min-width:70px;border-bottom:2px solid var(--accent);color:var(--accent);text-align:center;padding:0 4px}
.blank.ok{color:var(--ok);border-color:var(--ok)}.blank.bad{color:var(--bad);border-color:var(--bad)}
.hint{font-size:15px;margin:6px 0}
.hint b{font-family:var(--mono);background:var(--line2);padding:1px 7px;border-radius:6px}
.ru{font-size:13.5px;color:var(--muted);margin-bottom:10px}
.opts{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;text-align:left;cursor:pointer;font-size:16.5px;display:flex;gap:10px;align-items:center;min-height:48px;touch-action:manipulation}
.opt .k{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.inp{width:100%;font-size:19px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.inp:focus{outline:none;border-color:var(--accent)}
.kb{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}
.kb button{min-width:38px;min-height:38px;border:1px solid var(--line);border-radius:8px;background:var(--line2);font-size:17px;cursor:pointer;touch-action:manipulation}
.fb{margin-top:12px;border-radius:12px;padding:12px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
#next{scroll-margin-bottom:calc(84px + env(safe-area-inset-bottom))}
.fb .head{font-weight:800;font-size:16px;margin-bottom:4px}
.fb .full{font-size:16px;margin:4px 0 8px}
.fb .full mark{background:none;color:var(--ok);font-weight:800;border-bottom:2px solid var(--ok)}
.rule{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:14.5px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;vertical-align:1px}
.cN{background:var(--cN)}.cG{background:var(--cG)}.cD{background:var(--cD)}.cA{background:var(--cA)}.cI{background:var(--cI)}.cL{background:var(--cL)}.cV{background:var(--cV)}
table.par{border-collapse:collapse;font-size:13.5px;margin-top:6px;width:100%}
table.par th,table.par td{border:1px solid var(--line);padding:4px 6px;text-align:left}
table.par th{background:var(--line2);font-weight:600}
table.par td.hl{background:var(--ok-soft);font-weight:800}
table.par td.me{background:var(--bad-soft)}
details{margin-top:8px}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
.aibox{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.ai-lab{font-size:13px;color:var(--muted);font-weight:600}
.ai-txt{font:12.5px/1.45 var(--mono);width:100%;resize:vertical;padding:8px 10px;border:1px dashed var(--accent);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer}
.prog{display:flex;gap:4px;margin:2px 0 10px}
.prog i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.prog i.ok{background:var(--ok)}.prog i.bad{background:var(--bad)}.prog i.cur{background:var(--yel)}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.modal .box{background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal .box h2{font-size:20px}
.chg{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:14px;margin:8px 0}
.chg .p{color:var(--ok);font-weight:700;text-align:right}.chg .n{color:var(--bad);font-weight:700;text-align:right}
/* matrix */
.mtx{border-collapse:separate;border-spacing:3px;font-size:11.5px;width:100%;table-layout:fixed}
.mtx th{font-weight:700;color:var(--muted);text-align:center;padding:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mtx th.rl{text-align:left;width:76px}
.mtx td{height:34px;border-radius:7px;text-align:center;cursor:pointer;font-weight:700;font-size:11px;background:var(--line2);color:var(--muted)}
.mtx td.na{background:none;cursor:default;color:var(--line)}
.mtx td.s-new{background:var(--line2)}
.mtx td.s-bad{background:var(--bad-soft);color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.mtx td.s-mid{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.mtx td.s-ok{background:var(--ok-soft);color:var(--ok);box-shadow:inset 0 0 0 1.5px var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);font-weight:700}
.seg.pills{border:0;flex-wrap:wrap;gap:6px;overflow:visible}
.seg.pills button{border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.runwrap{max-width:820px;margin:0 auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.tbls h3{margin-top:14px}
.scroll{overflow-x:auto}
.mist{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}
.mist .a{color:var(--ok);font-weight:700}.mist .g{color:var(--bad);text-decoration:line-through}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:92vw}
.big{font-size:40px;line-height:1;margin-bottom:6px}
.side .panel{margin-bottom:12px}
@media (min-width:640px){.map{grid-template-columns:repeat(3,1fr)}.opts{grid-template-columns:1fr 1fr}.modal{align-items:center}.modal .box{border-radius:16px}}
@media (min-width:960px){
 body{padding-bottom:0}
 nav.tabs{position:static;border:0;background:none;padding:0;margin-left:16px;gap:2px}
 nav.tabs button{flex:none;flex-direction:row;gap:6px;font-size:14px;padding:8px 12px;border-radius:8px}
 nav.tabs button .ic{font-size:16px}
 nav.tabs button[aria-selected=true]{background:var(--accent-soft)}
 .toprow{gap:6px}
 .gamegrid{display:grid;grid-template-columns:320px 1fr;gap:16px;align-items:start}
 .side{position:sticky;top:76px}
 .map{grid-template-columns:repeat(4,1fr)}
 .toast{bottom:24px}
 #next{scroll-margin-bottom:20px}
 .mtx{font-size:12.5px}.mtx th.rl{width:110px}
}
</style>
</head>
<body>
<header class="top">
 <div class="flag"></div>
 <div class="wrap toprow">
  <div class="brand">Gyvenimas Vilniuje<small>литовский до B1 в игре</small></div>
  <nav class="tabs" id="tabs">
   <button data-tab="game" aria-selected="true"><span class="ic">🏙️</span>Miestas</button>
   <button data-tab="train"><span class="ic">🎯</span>Тренировка</button>
   <button data-tab="mist"><span class="ic">📕</span>Ошибки</button>
   <button data-tab="tables"><span class="ic">📋</span>Таблицы</button>
   <button data-tab="lb"><span class="ic">🏆</span>Рейтинг</button>
  </nav>
  <div class="topinfo" id="topinfo"></div>
 </div>
</header>
<main class="wrap">
 <section id="tab-game"></section>
 <section id="tab-train" hidden></section>
 <section id="tab-mist" hidden></section>
 <section id="tab-tables" hidden></section>
 <section id="tab-lb" hidden></section>
</main>
<div class="modal" id="modal" hidden><div class="box" id="mbox"></div></div>
<script>
'use strict';
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const CLOUD_SKIP=['cloud','tab','trv'];
const store={get(k,d){try{const v=localStorage.getItem('ltv_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('ltv_'+k,JSON.stringify(v));if(!CLOUD_SKIP.includes(k))window.__cloudDirty=true}catch(e){}}};
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const uniq=a=>[...new Set(a)];
function wpick(items,wf){const w=items.map(wf);const t=w.reduce((a,b)=>a+b,0);if(!(t>0))return pick(items);let r=Math.random()*t;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}return items[items.length-1]}
const norm=s=>String(s||'').toLowerCase().replace(/[.,!?;:«»"„“]/g,' ').replace(/\s+/g,' ').trim();
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}

/* ============ sound ============ */
let AC=null;
function beep(f,d,type,vol){if(!SET.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||.06;o.connect(g);g.connect(AC.destination);const t=AC.currentTime;g.gain.setValueAtTime(vol||.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d)}catch(e){}}
const SFX={ok(){beep(660,.12);setTimeout(()=>beep(880,.16),90)},bad(){beep(200,.25,'square',.04)},coin(){beep(988,.08);setTimeout(()=>beep(1319,.18),70)},click(){beep(440,.04,'triangle',.03)}};

/* ============ grammar: cases ============ */
const CS=['N','G','D','A','I','L','V'];
const CASE={N:{lt:'Vardininkas',q:'Kas?',ru:'именительный'},G:{lt:'Kilmininkas',q:'Ko?',ru:'родительный'},D:{lt:'Naudininkas',q:'Kam?',ru:'дательный'},A:{lt:'Galininkas',q:'Ką?',ru:'винительный'},I:{lt:'Įnagininkas',q:'Kuo?',ru:'творительный'},L:{lt:'Vietininkas',q:'Kur? Kame?',ru:'местный'},V:{lt:'Šauksmininkas',q:'обращение',ru:'звательный'}};
const chip=c=>`<span class="chip c${c}">${CASE[c].lt} · ${CASE[c].q}</span>`;
const NUMRU={sg:'ед.ч.',pl:'мн.ч.'};
const NUMLT={sg:'vns.',pl:'dgs.'};

/* noun paradigms: '*' = soft stem (t→č, d→dž), '#' = genitive plural stored per word */
const PARA={
 as:{g:'m',row:'as',lab:'-as',cut:'as',plcut:'ai',s:['as','o','ui','ą','u','e','e'],p:['ai','ų','ams','us','ais','uose','ai']},
 is:{g:'m',row:'is',lab:'-is',cut:'is',plcut:'iai',s:['is','*io','*iui','į','*iu','yje','i'],p:['*iai','*ių','*iams','*ius','*iais','*iuose','*iai']},
 ys:{g:'m',row:'ys',lab:'-ys',cut:'ys',plcut:'iai',s:['ys','*io','*iui','į','*iu','yje','y'],p:['*iai','*ių','*iams','*ius','*iais','*iuose','*iai']},
 us:{g:'m',row:'us',lab:'-us',cut:'us',plcut:'ūs',s:['us','aus','ui','ų','umi','uje','au'],p:['ūs','ų','ums','us','umis','uose','ūs']},
 ius:{g:'m',row:'ius',lab:'-ius / -jus',cut:'ius',plcut:'iai',s:['ius','iaus','iui','ių','iumi','iuje','iau'],p:['iai','ių','iams','ius','iais','iuose','iai']},
 jus:{g:'m',row:'ius',lab:'-jus',cut:'jus',plcut:'jai',s:['jus','jaus','jui','jų','jumi','juje','jau'],p:['jai','jų','jams','jus','jais','juose','jai']},
 is3m:{g:'m',row:'is3m',lab:'-is (dantis)',cut:'is',plcut:'ys',s:['is','ies','*iui','į','imi','yje','ie'],p:['ys','#','ims','is','imis','yse','ys']},
 uo:{g:'m',row:'uo',lab:'-uo (vanduo, šuo)',irr:1},
 a:{g:'f',row:'a',lab:'-a',cut:'a',plcut:'os',s:['a','os','ai','ą','a','oje','a'],p:['os','ų','oms','as','omis','ose','os']},
 ia:{g:'f',row:'ia',lab:'-ia',cut:'ia',plcut:'ios',s:['ia','ios','iai','ią','ia','ioje','ia'],p:['ios','ių','ioms','ias','iomis','iose','ios']},
 e:{g:'f',row:'e',lab:'-ė',cut:'ė',plcut:'ės',s:['ė','ės','ei','ę','e','ėje','e'],p:['ės','*ių','ėms','es','ėmis','ėse','ės']},
 is3:{g:'f',row:'is3',lab:'-is (ж.р.)',cut:'is',plcut:'ys',s:['is','ies','*iai','į','imi','yje','ie'],p:['ys','#','ims','is','imis','yse','ys']},

 const P=poolFor(ctx);const mix=ctx.mix||LOCMIX[ctx.loc]||LOCMIX.any;const out=[];const used=new Set();let lastLem='';
 for(let i=0;i<count;i++){
  const types=Object.keys(P).filter(t=>Object.keys(P[t]).length&&(mix[t]||ctx.key));if(!types.length)break;
  const t=ctx.key?types[0]:wpick(types,x=>mix[x]||0);
  const keys=Object.keys(P[t]);let tries=0,item=null;
  while(tries++<12&&!item){const k=wpick(keys,kw);const cand=P[t][k].filter(x=>!used.has(x.sig)&&(x.spec.w==null||x.spec.w!==lastLem));const c2=cand.length?cand:P[t][k];const it=wpick(c2,x=>iw(x.sig));if(!used.has(it.sig)||tries>10)item=it}

/* ============ leaderboard + cloud save (Supabase RPC, as in finance please) ============
   Fill window.LB_CONFIG={supabaseUrl:'…',supabaseKey:'…'} before the first <script>.
   All tables and functions use the ltv_ prefix (see supabase.sql). */
const LB_CONFIG=Object.assign({supabaseUrl:'',supabaseKey:'',prefix:'ltv_'},window.LB_CONFIG||{});
const LB={online:!!(LB_CONFIG.supabaseUrl&&LB_CONFIG.supabaseKey)};
const CLOUD={pending:null,busy:false,msg:null};
const lifeGet=()=>store.get('life',{answered:0,correct:0,bestDay:0,maxJob:0,wins:0});
function lifeBump(f){const L=lifeGet();f(L);store.set('life',L)}
function lbPid(){let id=store.get('pid',null);if(!id){id=(window.crypto&&crypto.randomUUID?crypto.randomUUID():'p'+Date.now().toString(36)+Math.random().toString(36).slice(2));store.set('pid',id)}return id}
function masteredCount(){const P=poolFor({lv:9});let n=0,t=0;['n','a','v','num','p'].forEach(k=>Object.keys(P[k]).forEach(x=>{t++;if(cellState(x)==='ok')n++}));return[n,t]}
function lbStats(){const L=lifeGet();const[m,t]=masteredCount();return{best_day:L.bestDay||0,max_job:L.maxJob||0,mastered:m,total:t,correct:L.correct||0,answered:Math.max(L.answered||0,L.correct||0),wins:L.wins||0}}
const lbScore=s=>Math.min(1e6,s.wins*500+s.best_day*20+s.max_job*100+s.mastered*10+Math.min(s.correct,200000)*2);
const pct=(c,a)=>a?Math.round(c/a*100)+'%':'—';
function rpc(fn,body,keep){const b=JSON.stringify(body);return fetch(`${LB_CONFIG.supabaseUrl.replace(/\/$/,'')}/rest/v1/rpc/${LB_CONFIG.prefix}${fn}`,{method:'POST',keepalive:!!keep&&b.length<60000,headers:{apikey:LB_CONFIG.supabaseKey,Authorization:'Bearer '+LB_CONFIG.supabaseKey,'Content-Type':'application/json'},body:b})
 .then(async r=>{const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.hint))||('HTTP '+r.status));return j})}
async function lbFetch(){const u=`${LB_CONFIG.supabaseUrl.replace(/\/$/,'')}/rest/v1/${LB_CONFIG.prefix}leaderboard?select=name,score,best_day,max_job,mastered,correct,answered,wins&order=score.desc&limit=50`;
 const r=await fetch(u,{headers:{apikey:LB_CONFIG.supabaseKey,Authorization:'Bearer '+LB_CONFIG.supabaseKey}});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}
async function lbSubmit(){const a=store.get('cloud',null);if(!LB.online||!a)return false;const s=lbStats();
 await rpc('lb_submit',{p_token:a.token,p_best_day:s.best_day,p_max_job:s.max_job,p_mastered:s.mastered,p_correct:s.correct,p_answered:s.answered,p_wins:s.wins});return true}
function lbPush(){if(LB.online&&store.get('cloud',null))lbSubmit().catch(()=>{})}
function cloudKeys(){const ks=[];try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('ltv_')&&!CLOUD_SKIP.includes(k.slice(4)))ks.push(k)}}catch(e){}return ks}
function cloudCollect(){const d={};cloudKeys().forEach(k=>{try{d[k.slice(4)]=localStorage.getItem(k)}catch(e){}});return d}
const cloudHasData=d=>!!d&&['game','srs','life','rec'].some(k=>k in d);
function cloudSummary(d){try{const g=JSON.parse(d.game||'null'),L=JSON.parse(d.life||'null');return`${g&&g.alive?`день ${g.day}, ${EDU[g.edu].lt}, ${g.money} €`:'игра не начата'}; ответов ${L?L.answered:0}, рекорд ${L?L.bestDay:0} дн.`}catch(e){return'нет данных'}}
function cloudSetAcct(a){store.set('cloud',a);store.set('pid',a.player_id)}
function cloudApply(data,a,t){try{cloudKeys().forEach(k=>localStorage.removeItem(k));Object.entries(data||{}).forEach(([k,v])=>{if(typeof v==='string'&&!CLOUD_SKIP.includes(k))localStorage.setItem('ltv_'+k,v)})}catch(e){}
 cloudSetAcct(Object.assign({},a,{syncedAt:t?Date.parse(t):Date.now(),savedAt:Date.now()}));window.__cloudDirty=false;location.reload()}
async function cloudSave(keep){const a=store.get('cloud',null);if(!LB.online||!a||CLOUD.busy)return false;CLOUD.busy=true;window.__cloudDirty=false;
 try{const r=await rpc('cloud_save',{p_token:a.token,p_data:cloudCollect()},keep);a.syncedAt=Date.parse(r.updated_at)||Date.now();a.savedAt=Date.now();localStorage.setItem('ltv_cloud',JSON.stringify(a));cloudUI();return true}
 catch(e){window.__cloudDirty=true;if(/bad_token/.test(e.message)){try{localStorage.removeItem('ltv_cloud')}catch(_){}cloudUI('Сессия устарела, войдите заново.')}else cloudUI('Не удалось сохранить: '+e.message);return false}finally{CLOUD.busy=false}}
function cloudUI(msg){if(msg!=null)CLOUD.msg=msg;const h=$('#tab-lb');if(!h||h.hidden||!$('#cloudBox'))return;const a=store.get('cloud',null);
 const t=a&&a.savedAt?new Date(a.savedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
 $('#cloudForm').hidden=!LB.online||!!a||!!CLOUD.pending;$('#cloudIn').hidden=!a;$('#cloudPick').hidden=!CLOUD.pending;
 $('#cloudState').textContent=!LB.online?'офлайн':a?`вы вошли как ${a.name}${t?' · сохранено в '+t:''}`:'вход не выполнен';
 $('#cloudMsg').textContent=CLOUD.msg!=null?CLOUD.msg:(!LB.online?'Аккаунты заработают, когда игра будет размещена на Lovable с Supabase. Пока прогресс хранится только в этом браузере.':'')}
async function renderLB(){const h=$('#tab-lb');const s=lbStats(),sc=lbScore(s),a=store.get('cloud',null);
 h.innerHTML=`<div class="panel"><h2>Рейтинг</h2><p class="small">${LB.online?'<span class="chip cL">Глобальный рейтинг подключён</span>'+(a?'':' Чтобы попасть в рейтинг, войдите в аккаунт ниже.'):'<span class="chip cD">Офлайн</span> Глобальный рейтинг заработает на Lovable с Supabase. Пока видны только ваши результаты.'}</p>
 <div class="status" style="grid-template-columns:repeat(3,1fr)"><div><span>Очки</span><b>${sc}</b></div><div><span>Рекорд дней</span><b>${s.best_day}</b></div><div><span>Лучшая работа</span><b>${esc(JOBS[s.max_job]?JOBS[s.max_job].m:'—')}</b></div><div><span>Освоено комбинаций</span><b>${s.mastered} / ${s.total}</b></div><div><span>Точность</span><b>${pct(s.correct,s.answered)}</b></div><div><span>B1 сдан</span><b>${s.wins?s.wins+' раз':'нет'}</b></div></div>
 <p class="tiny muted" style="margin-top:8px">Очки = 500 за сданный B1 + 20 за каждый день рекорда + 100 за уровень лучшей работы + 10 за освоенную комбинацию + 2 за правильный ответ.</p></div>
 <div class="panel" id="cloudBox"><h3>Аккаунт и облачное сохранение</h3><p class="small muted" id="cloudState"></p>
 <div id="cloudForm"><p class="small">Ник и PIN из 4–12 цифр. Если ник свободен, аккаунт создастся. С тем же ником и PIN можно продолжить на другом устройстве.</p><div class="row"><input class="inp" id="cloudName" maxlength="24" placeholder="Ник" autocomplete="username" style="flex:1;min-width:140px"><input class="inp" id="cloudPin" inputmode="numeric" maxlength="12" placeholder="PIN" type="password" autocomplete="current-password" style="width:120px"><button class="btn primary" id="cloudLogin">Войти</button></div></div>
 <div id="cloudIn" hidden><p class="small">Прогресс сохраняется сам каждые 20 секунд и при закрытии вкладки.</p><div class="row"><button class="btn small" id="cloudSaveNow">Сохранить сейчас</button><button class="btn small" id="cloudLoadNow">Загрузить из облака</button><button class="btn small ghost" id="cloudOut">Выйти</button></div></div>
 <div id="cloudPick" hidden><p class="small" id="cloudPickTxt"></p><div class="row"><button class="btn primary small" id="cloudUseCloud">Взять из облака</button><button class="btn small" id="cloudUseLocal">Оставить с этого устройства</button></div></div>
 <p class="small" id="cloudMsg" style="margin-top:8px"></p></div>
 <div class="panel"><div class="row" style="justify-content:space-between"><h3>Топ-50</h3><button class="btn small" id="lbRefresh">Обновить</button></div><div class="scroll"><table class="par" id="lbTable" style="font-size:13px"></table></div></div>`;
 if(CLOUD.pending)$('#cloudPickTxt').textContent=CLOUD.pending.txt;
 $('#cloudLogin').onclick=cloudLogin;$('#cloudPin').onkeydown=e=>{if(e.key==='Enter')cloudLogin()};
 $('#cloudUseCloud').onclick=()=>{const p=CLOUD.pending;if(p)cloudApply(p.data,p.a,p.t)};
 $('#cloudUseLocal').onclick=async()=>{const p=CLOUD.pending;if(!p)return;CLOUD.pending=null;cloudSetAcct(p.a);await cloudSave();lbPush();renderLB();cloudUI('Прогресс этого устройства сохранён в облако.')};
 $('#cloudSaveNow').onclick=async()=>{if(await cloudSave())cloudUI('Сохранено.')};
 $('#cloudLoadNow').onclick=async e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Точно? Прогресс на этом устройстве заменится';return}const a2=store.get('cloud',null);if(!a2)return;try{const r=await rpc('cloud_load',{p_token:a2.token});cloudApply(r.data,a2,r.updated_at)}catch(err){cloudUI('Не удалось загрузить: '+err.message)}};
 $('#cloudOut').onclick=async()=>{if(window.__cloudDirty)await cloudSave();try{localStorage.removeItem('ltv_cloud')}catch(e){}renderLB();cloudUI('Вы вышли. Прогресс на этом устройстве остался.')};
 $('#lbRefresh').onclick=renderLB;cloudUI();
 const tb=$('#lbTable');const head='<tr><th>#</th><th>Игрок</th><th>Очки</th><th>Дней</th><th>Освоено</th><th>%</th></tr>';
 const row=(i,r,mine)=>`<tr${mine?' style="font-weight:700;background:var(--accent-soft)"':''}><td>${i}</td><td>${esc(r.name||'—')}${r.wins?' 🎓':''}</td><td>${r.score}</td><td>${r.best_day}</td><td>${r.mastered}</td><td>${pct(r.correct,r.answered)}</td></tr>`;
 if(!LB.online){tb.innerHTML=head+row(1,{name:a?a.name:'Вы',score:sc,...s},true);return}
 tb.innerHTML='<tr><td class="muted">Загрузка…</td></tr>';
 try{const rows=await lbFetch();if(!$('#lbTable'))return;$('#lbTable').innerHTML=rows.length?head+rows.map((r,i)=>row(i+1,r,!!a&&r.name===a.name)).join(''):'<tr><td>Пока пусто. Будьте первым!</td></tr>'}
 catch(e){if($('#lbTable'))$('#lbTable').innerHTML=`<tr><td>Не удалось загрузить рейтинг (${esc(e.message)}). Проверьте адрес и ключ Supabase.</td></tr>`}}
async function cloudLogin(){if(!LB.online)return cloudUI();const name=$('#cloudName').value.trim(),pin=$('#cloudPin').value.trim();
 if(!name)return cloudUI('Введите ник.');if(!/^\d{4,12}$/.test(pin))return cloudUI('PIN: от 4 до 12 цифр.');cloudUI('Вхожу…');
 try{const r=await rpc('cloud_login',{p_name:name,p_pin:pin,p_player_id:lbPid()});
  if(r.error==='bad_pin')return cloudUI('Неверный PIN для этого ника. Если ник не ваш, выберите другой.');
  const a={token:r.token,name:r.name,player_id:r.player_id},local=cloudCollect();
  if(r.created||!cloudHasData(r.data)){cloudSetAcct(a);await cloudSave();lbPush();await renderLB();return cloudUI(r.created?'Аккаунт создан. Прогресс с этого устройства сохранён в облако.':'Вход выполнен. Прогресс сохранён в облако.')}
  if(!cloudHasData(local))return cloudApply(r.data,a,r.updated_at);
  CLOUD.pending={a,data:r.data,t:r.updated_at,txt:`В облаке: ${cloudSummary(r.data)} На этом устройстве: ${cloudSummary(local)} Какой прогресс оставить?`};renderLB();cloudUI('')}
 catch(e){cloudUI(/locked/.test(e.message)?'Слишком много неверных PIN. Попробуйте через 15 минут.':/bad_name/.test(e.message)?'Ник должен быть от 1 до 24 символов.':'Ошибка входа: '+e.message)}}
setInterval(()=>{if(window.__cloudDirty)cloudSave()},20000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&window.__cloudDirty)cloudSave(true)});
window.addEventListener('pagehide',()=>{if(window.__cloudDirty)cloudSave(true)});
(async()=>{const a=store.get('cloud',null);if(!LB.online||!a)return;
 try{const r=await rpc('cloud_load',{p_token:a.token});const t=Date.parse(r.updated_at)||0;if(t>(a.syncedAt||0)+1000&&cloudHasData(r.data))return cloudApply(r.data,a,r.updated_at)}
 catch(e){if(/bad_token/.test(e.message)){try{localStorage.removeItem('ltv_cloud')}catch(_){}cloudUI('Сессия устарела, войдите заново.')}}})();

/* ============ tabs ============ */
const TABS=['game','train','mist','tables','lb'];
function showTab(t){if(!TABS.includes(t))t='game';TABS.forEach(x=>$('#tab-'+x).hidden=x!==t);document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));store.set('tab',t);
 if(RUN&&RUN.kind==='train'&&t!=='train'){RUN=null}
 if(t==='game'&&!(RUN&&RUN.kind==='game'))renderGame();if(t==='train'&&!(RUN&&RUN.kind==='train'))renderTrain();if(t==='mist')renderMist();if(t==='tables')renderTables();if(t==='lb')renderLB();window.scrollTo(0,0)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){SFX.click();showTab(b.dataset.tab)}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'&&$('#mbox .btn.primary')==null)closeModal()});
window.__LT={W,ADJ,VERBS,TPL,DLG,nounForms,adjForm,verbForms,numWords,numNoun,buildCombos,poolFor,pickSpecs,buildTask,concretize,get NCOMBO(){return NCOMBO},get ACOMBO(){return ACOMBO}};
window.__cloudDirty=false;renderGame();showTab(store.get('tab','game'));
</script>
